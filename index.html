<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOVA AI</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col h-screen font-sans antialiased select-none">

  <!-- Header -->
  <header class="p-4 bg-gray-900 border-b border-gray-800 flex justify-between items-center px-5 shadow-sm">
    <div class="flex items-center gap-2 cursor-pointer" onclick="checkSecretAdminAccess()">
      <span class="text-xl font-bold tracking-wide text-white">NOVA AI</span>
      <span class="w-2 h-2 bg-green-500 rounded-full"></span>
    </div>

    <!-- Login/Account Button -->
    <button onclick="toggleAuthModal()" id="auth-btn" class="bg-gray-800 hover:bg-gray-700 text-xs text-gray-200 border border-gray-700 px-3 py-1.5 rounded-full flex items-center gap-2">
      <span id="user-status-text">Sign In / Account</span>
    </button>
  </header>

  <!-- Chat Area -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col">
    <div class="bg-gray-900 text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-[85%] self-start shadow border border-gray-800 text-sm sm:text-base">
      Namaste! Main NOVA AI hoon. Main aapki kya madad kar sakta hoon?
    </div>
  </main>

  <!-- Input Bar -->
  <footer class="p-3 bg-gray-900 border-t border-gray-800 flex items-center gap-2">
    <input type="text" id="user-input" placeholder="Message NOVA AI..." class="flex-1 p-3.5 rounded-full bg-gray-950 text-white placeholder-gray-500 outline-none px-5 text-base border border-gray-800 focus:border-blue-600">
    <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-3.5 rounded-full shadow">
      Send
    </button>
  </footer>

  <!-- User Login Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-sm w-full space-y-4 text-center">
      <h3 class="text-lg font-bold text-white">NOVA AI Login</h3>
      <p class="text-xs text-gray-400">Email aur Secret PIN daal kar account sync karein.</p>
      <input type="email" id="auth-email" placeholder="Aapka Email Address" class="w-full p-3 rounded-xl bg-gray-950 border border-gray-800 text-sm text-white outline-none">
      <input type="password" id="auth-pin" placeholder="Secret PIN" class="w-full p-3 rounded-xl bg-gray-950 border border-gray-800 text-sm text-white outline-none">
      <div class="flex gap-2">
        <button onclick="loginUser()" class="flex-1 bg-blue-600 py-2.5 rounded-xl font-medium text-sm text-white">Login</button>
        <button onclick="toggleAuthModal()" class="flex-1 bg-gray-800 py-2.5 rounded-xl font-medium text-sm text-gray-300">Close</button>
      </div>
    </div>
  </div>

  <!-- Hidden Owner Admin Access -->
  <div id="admin-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-900 border border-red-900/50 p-6 rounded-2xl max-w-sm w-full space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-md font-bold text-red-400">Owner Admin Access</h3>
        <button onclick="closeAdminModal()" class="text-gray-400">✕</button>
      </div>
      <input type="password" id="admin-pass" placeholder="Owner Password" class="w-full p-3 rounded-xl bg-gray-950 border border-gray-800 text-sm text-white outline-none">
      <button onclick="verifyAdmin()" class="w-full bg-red-600 py-2.5 rounded-xl font-medium text-sm text-white">Access Admin</button>
    </div>
  </div>

  <script>
    let tapCount = 0, tapTimer;

    function checkSecretAdminAccess() {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 5) {
        document.getElementById('admin-modal').classList.remove('hidden');
        tapCount = 0;
      }
      tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    function verifyAdmin() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === "Mohtasim@Secure2026") {
        alert("Owner Access Granted!");
        closeAdminModal();
      } else {
        alert("Incorrect Password!");
      }
    }

    function toggleAuthModal() {
      document.getElementById('auth-modal').classList.toggle('hidden');
    }

    function loginUser() {
      const email = document.getElementById('auth-email').value;
      if (email) {
        localStorage.setItem('nova_user_email', email);
        document.getElementById('user-status-text').innerText = email.split('@')[0];
        toggleAuthModal();
      }
    }

    async function sendMessage() {
      const inputField = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const userText = inputField.value.trim();

      if (!userText) return;

      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'bg-blue-600 text-white p-3.5 rounded-2xl rounded-tr-none max-w-[85%] self-end shadow-sm text-sm sm:text-base';
      userMsgDiv.innerText = userText;
      chatBox.appendChild(userMsgDiv);

      inputField.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'bg-gray-900 text-gray-200 p-3.5 rounded-2xl rounded-tl-none max-w-[85%] self-start shadow border border-gray-800 text-sm sm:text-base';
      aiMsgDiv.innerText = 'Soch raha hoon...';
      chatBox.appendChild(aiMsgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        aiMsgDiv.innerText = "Haan bilkul! Main aapki madad ke liye taiyar hoon. Batayein aaj kya baat karni hai?";
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 1000);
    }

    window.onload = () => {
      const savedUser = localStorage.getItem('nova_user_email');
      if (savedUser) {
        document.getElementById('user-status-text').innerText = savedUser.split('@')[0];
      }
    };
  </script>
</body>
</html>
